name: 验证简体中文界面与核心行为

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madeira-zh-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jit-helper:
    name: 验证 iOS JIT 助手与框架兼容性
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Xcode 与 iOS SDK
        run: |
          find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V
          NEWEST=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          test -n "$NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 对实际 iOS JIT 助手执行类型检查
        run: |
          # Parsing app Swift alone does not import the vendored framework's
          # textual module interface. Check the real helper against the device
          # SDK independently of the lengthy Wine/FEX build.
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library \
            -swift-version 5 -application-extension -module-name MadeiraJITHelper \
            -target arm64-apple-ios26.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -module-cache-path "$RUNNER_TEMP/swift-jit-helper-modules" \
            -F app/Frameworks/StikJIT.xcframework/ios-arm64 \
            app/Madeira/JITBuiltInMessages.swift \
            app/MadeiraJITHelper/MadeiraJITHelper.swift

  validate:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          NEWEST=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          test -n "$NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcrun swiftc --version
          # The tests invoke swiftc directly, so pass the selected host SDK
          # explicitly; unlike xcrun, the toolchain binary cannot infer it.
          HOST_SDK=$(xcrun --sdk macosx --show-sdk-path)
          test -d "$HOST_SDK"
          echo "SDKROOT=$HOST_SDK" >> "$GITHUB_ENV"
          echo "SWIFTC=$(xcrun --find swiftc)" >> "$GITHUB_ENV"

      - name: 检查全部 Swift 文件语法
        run: |
          find app -name '*.swift' -print0 | while IFS= read -r -d '' f; do
            xcrun swiftc -frontend -parse "$f"
          done

      # These host checks compile production Foundation/C blocks and use local
      # fixtures. They require neither Wine/FEX builds nor Steam credentials.
      - name: 验证引导流程
        run: python3 tests/host/check-onboarding.py

      - name: 验证触控布局
        run: python3 tests/host/check-control-presets.py

      - name: 验证游戏库与显示设置
        run: python3 tests/host/check-frontend.py

      - name: 验证 Steam 原生登录
        run: python3 tests/host/check-steam-signin-native.py

      - name: 验证 Steam 游戏管理
        run: python3 tests/host/check-steam-games.py

      - name: 验证 Steam 云存档
        run: python3 tests/host/check-steam-cloud.py

      - name: 验证 JIT 配置
        run: python3 tests/host/check-jit-method.py
