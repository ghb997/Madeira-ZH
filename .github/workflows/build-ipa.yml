name: 构建 Madeira 简体中文 IPA

on:
  workflow_dispatch:
    inputs:
      build_wow64:
        description: 构建完整 32 位 WoW64 运行时（首次构建耗时较长）
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: madeira-zh-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      BUILD_WOW64: ${{ inputs.build_wow64 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 选择 Xcode 并检查 Swift 语法
        id: versions
        run: |
          NEWEST=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          test -n "$NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK%%.*}" -ge 26
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "fex=$(git -C FEX rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "wine=$(git -C wine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dxmt=$(git -C dxmt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 tools/build-native-ci.py --cache-keys >> "$GITHUB_OUTPUT"
          find app -name '*.swift' -print0 | while IFS= read -r -d '' f; do
            xcrun swiftc -frontend -parse "$f"
          done
          python3 tests/host/check-config-catalog.py

      - name: 安装构建工具
        run: |
          brew install bison llvm lld ninja meson
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh"
            sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 校验依赖并准备全新构建
        run: bash tools/build-native-ci.sh prepare

      - name: 恢复 Wine 主机工具缓存
        id: winehost
        uses: actions/cache/restore@v4
        with:
          path: wine/build-native
          key: macos15-wine-host-v1-${{ steps.versions.outputs.wine }}-${{ steps.versions.outputs.wine_recipe }}

      - name: 恢复 Wine、字体、加密及媒体库缓存
        id: wine
        uses: actions/cache/restore@v4
        with:
          path: |
            wine/build-macos
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            build/freetype-ios/build
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libav*.a
            app/Madeira/libswresample.a
            app/Madeira/libgmp.a
            app/Madeira/libnettle.a
            app/Madeira/libhogweed.a
            app/Madeira/libgnutls.a
          key: macos15-ios${{ steps.versions.outputs.sdk }}-wine-v1-${{ steps.versions.outputs.wine }}-${{ steps.versions.outputs.wine_recipe }}-${{ hashFiles('build/ntdll-unix/**', 'build/wineserver/**', 'build/win32u-unix/**', 'build/ffmpeg/**', 'build/crypto-unix/**', 'build/madsync/**', 'build/hidpad/**') }}

      - name: 构建 Wine 原生库
        if: steps.wine.outputs.cache-hit != 'true'
        run: bash tools/build-native-ci.sh wine

      - name: 保存 Wine 主机工具
        if: always() && steps.winehost.outputs.cache-hit != 'true' && hashFiles('wine/build-native/tools/widl/widl') != ''
        uses: actions/cache/save@v4
        with:
          path: wine/build-native
          key: ${{ steps.winehost.outputs.cache-primary-key }}

      - name: 保存 Wine 原生库
        if: success() && steps.wine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            wine/build-macos
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            build/freetype-ios/build
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libav*.a
            app/Madeira/libswresample.a
            app/Madeira/libgmp.a
            app/Madeira/libnettle.a
            app/Madeira/libhogweed.a
            app/Madeira/libgnutls.a
          key: ${{ steps.wine.outputs.cache-primary-key }}

      - name: 恢复 FEX 缓存
        id: fex
        uses: actions/cache/restore@v4
        with:
          path: FEX/build-ios
          key: macos15-ios${{ steps.versions.outputs.sdk }}-fex-v1-${{ steps.versions.outputs.fex }}-${{ steps.versions.outputs.fex_recipe }}
      - name: 构建 FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: bash tools/build-native-ci.sh fex
      - name: 保存 FEX 缓存
        if: success() && steps.fex.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: FEX/build-ios
          key: ${{ steps.fex.outputs.cache-primary-key }}

      - name: 恢复 LLVM 缓存
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: macos15-ios${{ steps.versions.outputs.sdk }}-llvm-v1-8dfdcc7b7-${{ steps.versions.outputs.llvm_recipe }}
      - name: 构建 LLVM iOS 静态库
        if: steps.llvm.outputs.cache-hit != 'true'
        run: bash tools/build-native-ci.sh llvm
      - name: 保存 LLVM 缓存
        if: success() && steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - name: 恢复 DXMT 缓存
        id: dxmt
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/libdxmt_combined.a
          key: macos15-ios${{ steps.versions.outputs.sdk }}-dxmt-v1-${{ steps.versions.outputs.dxmt }}-${{ steps.versions.outputs.dxmt_recipe }}-${{ steps.versions.outputs.llvm_recipe }}-${{ hashFiles('build/dxmt-ios/build.sh', 'madeira-d3d12/src/**', 'madeira-d3d12/tests/native/msc_canary.mm') }}
      - name: 构建 DXMT 与 D3D12 原生运行时
        if: steps.dxmt.outputs.cache-hit != 'true'
        run: bash tools/build-native-ci.sh dxmt
      - name: 保存 DXMT 缓存
        if: success() && steps.dxmt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/libdxmt_combined.a
          key: ${{ steps.dxmt.outputs.cache-primary-key }}

      - name: 构建设备配对库
        run: bash tools/build-native-ci.sh pairing

      - name: 恢复 Windows 交叉编译工具链
        id: mingw
        uses: actions/cache/restore@v4
        with:
          path: toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: macos15-llvm-mingw-20260421-bd85a397-${{ steps.versions.outputs.mingw_recipe }}
      - name: 构建 Windows 运行时与 Madeira Dock
        run: bash tools/build-native-ci.sh runtime
      - name: 保存 Windows 交叉编译工具链
        if: always() && steps.mingw.outputs.cache-hit != 'true' && hashFiles('toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/clang') != ''
        uses: actions/cache/save@v4
        with:
          path: toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: ${{ steps.mingw.outputs.cache-primary-key }}

      - name: 编译汉化应用并生成未签名 IPA
        run: bash tools/build-native-ci.sh archive

      - name: 上传 IPA、校验和及构建清单
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ZH-${{ github.run_number }}-unsigned-ipa
          path: |
            build-out/*.ipa
            build-out/*.sha256
            build-out/build-manifest.json
            build-out/requested-entitlements.plist
          if-no-files-found: error
          retention-days: 30

      - name: 保存完整构建诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ZH-${{ github.run_number }}-build-logs
          path: |
            build-out/logs/*.log
            build-out/logs/*.txt
            build-out/logs/*.sha256
            build/**/*.err
            build/**/err-*.txt
            build/gnutls-ios/obj/*.log
            wine/build-i386/madeira-i386-build.log
          if-no-files-found: ignore
          retention-days: 14
